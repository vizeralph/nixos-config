name: Check

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check

      - name: Build NixOS systems
        if: github.event_name == 'workflow_dispatch'
        run: |
          nix build --no-link \
          .#nixosConfigurations.vize-strix-scar-g533qr.config.system.build.toplevel \
          .#nixosConfigurations.vize-zephyrus-m16-gu604vi.config.system.build.toplevel
